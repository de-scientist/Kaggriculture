version: "3.9"

services:
  agent:
    build: .
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./experiments:/app/experiments
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m agent.agent

  test:
    build: .
    volumes:
      - ./:/app
    command: pytest -x -v

  lint:
    build: .
    volumes:
      - ./:/app
    command: ruff check agent/ tests/ scripts/

  monitor:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml