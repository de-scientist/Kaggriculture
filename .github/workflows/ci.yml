name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Formatting check
        run: ruff format --check agent/ tests/ scripts/
      - name: Lint
        run: ruff check agent/ tests/ scripts/
      - name: Type check
        run: mypy agent/ tests/ --config-file pyproject.toml
      - name: Unit tests with coverage
        run: |
          pytest tests/unit/ tests/observability/ tests/services/ -v --cov=agent --cov-report=xml --cov-report=term --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest tests/integration/ -v
      - name: End-to-end tests
        run: pytest tests/end_to_end/ -v

  submission-validation:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install kaggle-environments
      - name: Submission validation
        run: python scripts/validate_submission.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.txt
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install kaggle-environments memory-profiler
      - name: Run benchmarks
        run: python scripts/benchmark.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/*.json
          if-no-files-found: ignore
