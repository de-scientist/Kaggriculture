version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(funcName)s:%(lineno)d - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/app.log
    encoding: utf-8

loggers:
  agent:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  agent.adapters:
    level: INFO
    handlers: [console, file]
    propagate: false
  agent.decision:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  agent.domain:
    level: INFO
    handlers: [console, file]
    propagate: false
  agent.services:
    level: INFO
    handlers: [console, file]
    propagate: false