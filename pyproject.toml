[project]
name = "kaggriculture-ai"
version = "0.1.0"
description = "Kaggriculture AI agent platform — Stage 1"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=0.1.0",
    "pyyaml>=6.0",
    "ruff>=0.7.0",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "performance: performance benchmarks",
    "e2e: end-to-end tests",
    "regression: regression tests",
    "observability: observability layer tests",
    "determinism: determinism and reproducibility tests",
]

[tool.coverage.run]
source = ["agent"]
omit = ["tests/*", "agent/config/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]